<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 240px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex: none; }
  .ok { background: #28c35a; } .bad { background: #e5484d; }
  .hint { color: #666; font-size: 12px; margin-top: 8px; }
  @media (prefers-color-scheme: dark) { body { background: #1e1f22; color: #e6e6e6; } .hint { color: #a0a0a0; } }
</style>
</head>
<body>
  <h1>MAICA</h1>
  <div class="row"><span id="app" class="dot"></span><span id="appText">Checking the desktop app...</span></div>
  <div class="row"><span id="site" class="dot"></span><span id="siteText"></span></div>
  <div class="hint" id="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
